# Generated by `swapcheck prompt` from prompts/incumbent-v1.md (spec §4.2). Never edit by hand.
luna-dec:
  questions:
  - type: choice
    name: intent
    instructions: 'You triage customer messages sent to a banking app''s support team. Choose exactly one of the listed intents: the one that matches what the customer is asking about or reporting. Judge by the customer''s main question or problem, not by single words in the message. If none of the listed intents fits the message, answer out_of_scope.'
    choices:
    - value: activate_my_card
      description: 'The customer has a card and wants to activate it or asks how activation works. Example: I need assistance to activate the card on my account.'
    - value: apple_pay_or_google_pay
      description: 'Using Apple Pay, Google Pay or a phone or watch wallet with the account, including topping up through them. Example: Can I add funds directly from my Apple Watch?'
    - value: automatic_top_up
      description: 'Setting up automatic top-ups or asking how they work, their rules and their limits. Example: When I travel, can it automatically add money in certain intervals?'
    - value: balance_not_updated_after_bank_transfer
      description: 'Money sent into the account by bank transfer has not appeared in the balance yet. Example: I''ve transferred money into my account but the balance is the same'
    - value: balance_not_updated_after_cheque_or_cash_deposit
      description: 'A cheque or cash deposit has not shown up in the account balance. Example: I put money in my account a week ago but its still not there, what is happening?'
    - value: beneficiary_not_allowed
      description: 'The customer cannot add or pay a particular beneficiary, or a payment to one was refused as not allowed. Example: Why can''t I use this beneficiary?'
    - value: cancel_transfer
      description: 'The customer wants to cancel, stop or reverse a transfer they made, often one sent to the wrong account. Example: I''ve made a horrible mistake!  I transferred money to the wrong account by accident!  I entered one of the digits wrong.  I need this cancelled immediately please.'
    - value: card_about_to_expire
      description: 'The card is expiring or has expired: how to get a replacement, what it costs and how long it takes. Example: I need a new card to replace an expired one. Will it cost anything, and how soon?'
    - value: card_arrival
      description: 'A new card has not arrived yet: delivery status, delays and tracking. Example: I was expecting my new card by now.'
    - value: card_linking
      description: 'Linking a received or found card to the app, or adding a card back to the app. Example: I received my card. How do I link it to the app?'
    - value: card_payment_fee_charged
      description: 'An unexpected fee was charged on a payment made with the card. Example: Explain the extra fee on my card when paying.'
    - value: card_payment_not_recognised
      description: 'A card payment in the app or on the statement that the customer does not recognise. Example: i dont recognize a charge on my card'
    - value: card_payment_wrong_exchange_rate
      description: 'The exchange rate applied to a card purchase in a foreign currency looks wrong. Example: I recently bought something in foreign currency and I am unsure of the exchange rate. Is this rate applied correctly?'
    - value: cash_withdrawal_charge
      description: 'A fee was charged for withdrawing cash. Example: Why did I get charged for withdrawing cash?'
    - value: cash_withdrawal_not_recognised
      description: 'A cash withdrawal on the account that the customer did not make or does not recognise. Example: I am seeing unathorized transactions in the app, on my account.'
    - value: change_pin
      description: 'How or where to change the card PIN. Example: How can I change my PIN even though I''m out of the country in Austria at the moment?'
    - value: country_support
      description: 'Which countries the service and its cards are available in or can be used in. Example: Which countries do you support?'
    - value: declined_card_payment
      description: 'A card payment or purchase was declined or did not go through. Example: I''m not sure why the card payment didn''t work.'
    - value: declined_cash_withdrawal
      description: 'An ATM declined a cash withdrawal or would not give out cash. Example: Why am I unable to withdraw my money through this card?'
    - value: declined_transfer
      description: 'A transfer was declined or rejected, and how to avoid that. Example: How can I check for an unsupported merchant for my transfer request?'
    - value: direct_debit_payment_not_recognised
      description: 'A direct debit on the account that the customer does not recognise or did not set up. Example: There is a direct debit charge on my account that I don''t recognize.'
    - value: disposable_card_limits
      description: 'Limits on disposable cards: how many can be created and how many transactions each one allows. Example: I must make several disposable cards every day.'
    - value: edit_personal_details
      description: 'Changing personal details on the account, such as the address after a move. Example: Can I change my details because I moved?'
    - value: exchange_charge
      description: 'Fees for exchanging one currency into another. Example: Do I pay extra for exchange?'
    - value: exchange_via_app
      description: 'How to exchange one currency for another in the app. Example: I would like to change to a different currency.'
    - value: extra_charge_on_statement
      description: 'An unexplained extra charge on the statement, often a small amount such as 1 pound or 1 dollar. Example: Why did they charge me an extra $1?'
    - value: failed_transfer
      description: 'An outgoing transfer failed or keeps failing. Example: I can''t transfer any money from my account to my friend''s account, it keeps rejecting it. Can you tell me why? I have enough funds in my account to transfer.'
    - value: fiat_currency_support
      description: 'Which currencies the customer can hold, and holding money in several currencies. Example: Am I allowed to hold money in multiple currencies?'
    - value: getting_spare_card
      description: 'Getting an additional card for the account, including one for a family member, and how many cards are allowed. Example: I''m looking to get an additional card.'
    - value: lost_or_stolen_phone
      description: 'The customer''s phone was lost or stolen, and what to do about access to the app and account. Example: my phone has been stolen by someone'
    - value: order_physical_card
      description: 'Ordering a physical card, including a physical version of a virtual card, its cost and where it can be delivered. Example: Where can I get a physical card?'
    - value: pending_card_payment
      description: 'A card payment still shows as pending, or what a pending payment means. Example: What does a ''pending payment'' mean?'
    - value: pending_cash_withdrawal
      description: 'An ATM cash withdrawal still shows as pending. Example: I needed cash today, so I used another provider''s ATM, and when I attempted to withdraw, it declined. I just checked it out and I''m still showing my account with that amount pending! I didn''t take any money out, it was declined, so I don''t want that to be processed as a withdrawal.'
    - value: pending_top_up
      description: 'A top-up is still pending or has not finished. Example: Why hasn''t my top-up finished pending yet?'
    - value: pending_transfer
      description: 'A transfer is stuck as pending, or how long the pending period lasts. Example: How long does the "pending" period of a transfer take?'
    - value: Refund_not_showing_up
      description: 'A refund that a merchant says it sent does not appear in the account or on the statement. Example: The refund isn''t appearing in my account'
    - value: request_refund
      description: 'The customer wants a refund or their money back for a purchase. Example: Please help me get a refund?'
    - value: reverted_card_payment?
      description: 'A card payment was taken and then returned to the account or cancelled, so the merchant was not paid. Example: I cannot seem to buy something online with my card? the payment comes back, what''s going on?'
    - value: supported_cards_and_currencies
      description: 'Which cards, such as Visa, Mastercard or foreign credit cards, and which currencies can be used to top up the account. Example: I only have one other credit card from the US. Do you accept that?'
    - value: top_up_failed
      description: 'A top-up from a card failed or was declined. Example: I tried to charge my card but it was declined. A couple days ago I was able to charge it and it was accepted. Is something wrong? Will you double check for me please?'
    - value: top_up_reverted
      description: 'A top-up appeared in the account and was then cancelled or reversed. Example: What did you do with my money??? I just topped up, I saw the money was there, but now it''s gone!! What did you do with it?'
    - value: transaction_charged_twice
      description: 'One purchase was charged twice or several times. Example: I had a duplicate card and bought something and it showed up twice. I canceled my card, how do I get my money back?'
    - value: transfer_fee_charged
      description: 'A fee was charged on a transfer, or the recipient received less than was sent. Example: Hi! I''m a university student studying abroad and I noticed that when I was trying to cross-reference my budget for this month that there were extra fees I was not expecting. Why is that? I''ve had this account for years and I haven''t had any trouble so far, it might not even be on your all''s end since I''m still new to international travel and finance, but I wanted to double check in case a mistake was made!'
    - value: transfer_not_received_by_recipient
      description: 'The recipient has not received a transfer that the customer sent. Example: I made a transfer the day before yesterday within this country. It is still not showing up at all. I have double-checked and the account number is certainly right. I''ve actually type this multiple times. can you look into what is going on here?'
    - value: transfer_timing
      description: 'How long a transfer takes to arrive, including transfers to and from other countries. Example: I just did a transfer, but don''t see the money in my account. What''s up?'
    - value: verify_top_up
      description: 'How to verify a top-up or the card used for it, including where to find the verification code. Example: I can''t see a verification code anywhere'
    - value: visa_or_mastercard
      description: 'Whether the card is a Visa or a Mastercard, or a preference for one of them. Example: Mastercard is my preferred company.'
    - value: why_verify_identity
      description: 'Why identity verification is needed, and using the account before verification is complete. Example: If my identy verifacation hasn''t gone through can I use my account?'
    - value: wrong_amount_of_cash_received
      description: 'An ATM gave out less cash than the customer requested. Example: I got some cash but it wasn''t the right amount.'
    - value: wrong_exchange_rate_for_cash_withdrawal
      description: 'The exchange rate applied to a cash withdrawal in a foreign currency looks wrong. Example: Can I make a withdraw in my home currency at an ATM? I''m on vacation and am a bit worried because I don''t have cash with me. Is it possible to withdraw here without any additional costs or fees?'
    - value: out_of_scope
      description: The customer message is about none of the other options.
