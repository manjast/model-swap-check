# Spend caps per provider, USD (spec §9.5). Spent = cost of every attempt and warm-up in runs/,
# priced with config/prices.yaml. No run may take a provider's spend past cap - reserve_margin_usd.

caps_usd:
  openai: 15.0
  anthropic: 10.0
  typesafe: 6.0  # raised from 5.0 by amendment 2 (spec §7.9)

reserve_margin_usd: 0.50
