# Configurations under test (spec §4). Each entry's hash is the SHA-256 of its canonical JSON
# (see swapcheck.configs). Values marked (pilot) may be changed by the M3 pilot, with the reason
# written in docs/pilot.md, before any dev run.

configurations:
  inc:
    provider: openai
    model: gpt-4o-mini-2024-07-18
    temperature: 0
    max_output_tokens: 100
    cache_mode: implicit
    prompt_cache_keys: 16

  luna-none:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0  # accepted only at effort none (OpenAI GPT-6 guide); confirmed by the pilot
    max_output_tokens: 200
    cache_mode: explicit
    cache_ttl: 30m

  luna-low:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: low
    # no temperature: rejected when reasoning effort is not none (OpenAI GPT-6 guide)
    max_output_tokens: 1024
    cache_mode: explicit
    cache_ttl: 30m

  luna-medium:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: medium
    # no temperature: rejected when reasoning effort is not none
    max_output_tokens: 4096
    cache_mode: explicit
    cache_ttl: 30m

  haiku55-off:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: disabled
    effort: low
    max_output_tokens: 200
    cache_mode: system_block

  haiku55-low:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: adaptive
    effort: low
    max_output_tokens: 1024
    cache_mode: system_block

  haiku55-medium:
    provider: anthropic
    model: claude-haiku-5-5
    thinking: adaptive
    effort: medium
    max_output_tokens: 4096
    cache_mode: system_block

  jev-c51:
    provider: typesafe
    model: jev-1.13.0
    jev_design: c51

  jev-noul:
    provider: typesafe
    model: jev-1.13.0
    jev_design: noul

  luna-none-x:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0  # follows luna-none
    max_output_tokens: 200
    cache_mode: explicit
    cache_ttl: 30m
    prompt: prompts/luna-none-x.md  # written at M4 (spec §8.3)

  luna-dec:
    provider: openai
    api: decisions  # POST /v1/decisions (spec §4.2); shares the OpenAI budget with the Responses configurations
    model: gpt-6-luna  # the only ID; no dated snapshot exists
    # no temperature, reasoning, max-token or cache parameters: none exist on this endpoint

  # Post hoc examples ablation (docs/examples-ablation.md): inc and luna-none with six catalog examples
  # replaced; dev only, never part of a contract.
  inc-ex:
    provider: openai
    model: gpt-4o-mini-2024-07-18
    temperature: 0
    max_output_tokens: 100
    cache_mode: implicit
    prompt_cache_keys: 16
    prompt: prompts/examples-ablation.md

  luna-none-ex:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0
    max_output_tokens: 200
    cache_mode: explicit
    cache_ttl: 30m
    prompt: prompts/examples-ablation.md

# Pilot-only variants (spec §9.1): caching comparison and option-order sensitivity (Jev, luna-dec).
pilot_variants:
  luna-none-implicit:
    base: luna-none
    cache_mode: implicit
  jev-c51-reversed:
    base: jev-c51
    option_order: reversed
  jev-noul-reversed:
    base: jev-noul
    option_order: reversed
  luna-dec-reversed:
    base: luna-dec
    option_order: reversed
